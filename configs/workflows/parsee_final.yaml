name: parsee_vad_paper_final

model:
  config: configs/model/qwen35_9b_config.json
  thinking: false
  device: 0

pipeline:
  version: parsee_iclr2027
  type: pixel_budget_sweep
  probe_policy: routed
  input_mode: multi_image_9f
  current_offsets: [-80, -70, -60, -50, -40, -30, -20, -10, 0]
  q2_positive_threshold: 0.0

  # Proposition-Aware Routing (PAR)
  p3_route:
    q2_gt: 0.0
    q3_gte: 0.0
  p4_route:
    q2_gte: 1.0
    q3_gte: 0.0
    p3_lte: 0.0

  # Bounded current-window proposition fusion.
  par:
    alpha: 0.75

  # One-step, non-recursive carry of the previous raw positive PAR correction.
  correction_carry:
    enabled: true
    rho: 0.5

  # Streaming Evidence Escalation (SEE): finite-horizon valley recovery.
  see:
    enabled: true
    horizon: 2
    valley_ratio: 0.2
    q2_continuity: 0.5
    rho: 0.5

  status_every_anchors: 8
  append_every: 8

pixel_budgets:
  default:
    max_pixels: 262144
    min_pixels: 1
    preserve_processor_default: false
  256sq:
    max_pixels: 65536
    min_pixels: 1
  384sq:
    max_pixels: 147456
    min_pixels: 1
  512sq:
    max_pixels: 262144
    min_pixels: 1

datasets:
  ucf:
    adapter: ucf
    manifest: data/manifests/ucf_test_windows.csv
    root_env: PARSEE_UCF_ROOT
    gt_keys: [gt_original, gt]
  msad:
    adapter: msad
    manifest: data/manifests/msad_test_windows.csv
    root_env: PARSEE_MSAD_ROOT
    gt_keys: [gt_msad, gt]
  xd:
    adapter: raw
    manifest: data/manifests/xd_violence_test_windows.csv
    root_env: PARSEE_XD_ROOT
    gt_keys: [gt]
  ubnormal:
    adapter: raw
    manifest: data/manifests/ubnormal_test_windows.csv
    root_env: PARSEE_UBNORMAL_ROOT
    gt_keys: [gt]

matrix:
  ucf: [default, 256sq, 384sq, 512sq]
  msad: [default, 256sq, 384sq, 512sq]
  xd: [default, 256sq, 384sq, 512sq]
  ubnormal: [default, 256sq, 384sq, 512sq]

output:
  root: runs

launch:
  # Portable public default. Increase GPUs/shards to parallelize independent videos.
  gpus: [0]
  shards: 1
  max_parallel_configs: 1
