    A. Yes. Clear forceful physical interaction between people is directly visible.
    B. No. No clear forceful physical interaction between people is directly visible.

    Answer with only A or B.

p4_consequential_object_environment_interaction:
  forward: |
    Judge only directly visible physical interaction with objects, property, vehicles, or the physical environment across the ordered observation.

    Do not judge whether the scene is normal, abnormal, suspicious, dangerous, or criminal.
    Do not infer an event merely from people walking, running, gathering, pointing, waving, arguing-like gestures, or moving around.

    Question: Is there a clear concrete physical interaction or event involving an object, property, vehicle, or the environment that goes beyond ordinary locomotion or social movement?

    Positive examples include directly visible carrying or removing property, manipulating or forcing access to an object or barrier, climbing over or through a barrier, breaking or damaging something, a vehicle collision or other clear vehicle-related physical event, or another directly visible consequential physical interaction with the environment.

    Mere walking or running, crowd gathering, standing around, pointing, waving, talking-like gestures, or ordinary vehicle movement without a clear physical event do not count.

    A. No. No clear concrete object-, vehicle-, or environment-related physical event is directly visible.
    B. Yes. A clear concrete object-, vehicle-, or environment-related physical event is directly visible.

    Answer with only A or B.

  reverse: |
