p3_forceful_physical_interaction:
  forward: |
    Judge only directly visible physical interaction between people across the ordered observation.

    Do not judge whether the scene is normal, abnormal, suspicious, dangerous, or criminal.
    Do not infer physical conflict merely because people are running, gathering, pointing, waving, arguing, facing each other, or moving around quickly.

    Question: Is there clear directly visible forceful physical interaction between people, such as hitting, pushing, grabbing, wrestling, restraining, or another sustained physical struggle involving actual bodily contact?

    Ordinary walking or running, people gathering nearby, pointing, waving, gesturing, arguing-like movements, or moving around without clear forceful bodily contact do not count.

    A. No. No clear forceful physical interaction between people is directly visible.
    B. Yes. Clear forceful physical interaction between people is directly visible.

    Answer with only A or B.

  reverse: |
    Judge only directly visible physical interaction between people across the ordered observation.

    Do not judge whether the scene is normal, abnormal, suspicious, dangerous, or criminal.
