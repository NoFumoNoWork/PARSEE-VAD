q2_native_anomaly:
  forward: |
    Based only on the visual evidence available up to the current time, classify the current event.

    A. Normal
    B. Abnormal

    Answer with A or B only.

  reverse: |
    Based only on the visual evidence available up to the current time, classify the current event.

    A. Abnormal
    B. Normal

    Answer with A or B only.

q3_visible_dynamics:
  forward: |
    You are comparing ordered frames from the same camera.

    Judge only directly visible physical change across time.
    Do not judge whether the scene is normal, abnormal, suspicious, dangerous, or important.
    Do not infer motion or change merely because a single frame suggests that an event may be occurring.

    A positive answer requires temporal visual evidence across the ordered frames showing that a person, object, interaction, or physical state actually changes over time.

    An already-existing condition does not count as active physical change by itself.
    Examples include fire already burning, smoke already present, a person already lying down, an already-damaged object, debris, darkness, or a crowd already gathered.

    Global camera motion, illumination changes, compression artifacts, or other imaging changes do not count as the target physical dynamics.

    Question: Do these ordered frames directly demonstrate clear physical change over time?

    A. No. They mainly show an already-existing state or appearance, without clear directly demonstrated physical change over time.
    B. Yes. They directly demonstrate clear physical change over time in people, objects, interactions, or physical state.

    Answer with only A or B.

  reverse: |
    You are comparing ordered frames from the same camera.

    Judge only directly visible physical change across time.
    Do not judge whether the scene is normal, abnormal, suspicious, dangerous, or important.
    Do not infer motion or change merely because a single frame suggests that an event may be occurring.

